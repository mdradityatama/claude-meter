name: Release

# Push a version tag (e.g. v0.1.0) to test, build the self-contained exe and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: dotnet publish src/ClaudeUsageTray -c Release -o publish "-p:Version=$($env:TAG.TrimStart('v'))"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$env:TAG" publish/ClaudeUsageTray.exe --title "$env:TAG" --generate-notes
